        function validarFormulario() {
       		const regexText = /^[a-záéíóú\s]{2,50}$/i;
        	const name = document.getElementById("userName").value.trim();
        	var mensajeError = document.getElementById("mensajeError");
        	
        	if(!name){
        		mensajeError.innerText = "Error: El campo no puede estar vacío.";
        		return false;
       		 }
        	if (!regexText.test(name)) {
        		mensajeError.innerText = "Error: El nombre debe contener entre 2 y 50 caracteres. No se permiten caracteres especiales o números.";
        		return false;
        	}
        	return true;
        }
    </script>
